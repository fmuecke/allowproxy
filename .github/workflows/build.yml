name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed for the version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allowproxy
          path: |
            out/allowproxy.exe
            README.md
            LICENSE
            CHANGELOG.md
          if-no-files-found: error

  # On a version tag, bundle the tested binary with README, LICENSE and CHANGELOG, attest the
  # provenance of the zip and the binary, and publish the zip as a release described by the
  # tag's CHANGELOG section (a tag v1.2.0 needs a "## [1.2.0]" heading).
  # Kept separate so the write permissions never reach the job that runs the build and tests.
  # Verify a download (zip or extracted exe) with:
  #   gh attestation verify <file> -R fmuecke/allowproxy
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allowproxy
          path: dist

      - name: Extract release notes
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" \
            'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            dist/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entries under '## [${GITHUB_REF_NAME#v}]'"
            exit 1
          fi
          printf '\nFull changelog: %s/%s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md

      - name: Bundle
        run: zip -j "allowproxy-$GITHUB_REF_NAME.zip" dist/out/allowproxy.exe dist/README.md dist/LICENSE dist/CHANGELOG.md

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            allowproxy-${{ github.ref_name }}.zip
            dist/out/allowproxy.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "allowproxy-$GITHUB_REF_NAME.zip" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
